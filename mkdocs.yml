site_name: Grancypher Wiki
site_description: Grancypher 使用说明
site_url: https://rawlkian.github.io/grancypher-release/

theme:
  name: material
  language: zh
  logo: img/Logo.png
  favicon: img/Logo.ico

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: 深色模式

    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 浅色模式

plugins:
  - search


nav:
  - Grancypher: index.md

  - 快速开始:
      - 安装与环境配置: install.md
      - 第一次使用: getting-started.md
      - 代理设置: proxy.md

  - 功能:
      - 书签管理: features/bookmarks.md
      - 分屏与置顶: features/split-pin.md
      - 自适应画面裁剪: features/resize.md
      - 太郎与用户脚本: features/tarou-js.md
      - Chrome 扩展插件: features/extensions.md
      - 快捷键与速达键: features/shortcuts.md
      - 多用户配置: features/multi-user.md
      - 本地缓存: features/local-cache.md
      - 设置: features/settings.md
  - 用户脚本:
      - 功能声明: scripts/feature-declaration.md
      - 自动周回跳转: scripts/auto-loop.md
      - 救援筛选: scripts/rescue-filter.md
      - 救援码粘贴: scripts/rescue-paste.md
      - 关闭技能窗口动画: scripts/skill-window.md
  - 常见问题: faq.md
  - 更新日志: changelog.md

extra_css:
  - stylesheets/sky-journal.css
